# Subject multilingual generator
name: Generate Subject Translations

on:
  workflow_dispatch:
  push:
    branches:
      - feat/subject-multilingual

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Generate translations
        run: |
          if find Subjects -type f -name '*_en.json' | grep -q .; then
            echo "Localized files already exist; skipping generation."
            exit 0
          fi
          python scripts/generate_subject_translations.py

      - name: Commit generated files
        run: |
          if find Subjects -type f -name '*_en.json' | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Subjects .subject_translation_cache.json
            git diff --cached --quiet || git commit -m "feat: add multilingual subject JSON files"
            git push
          fi
